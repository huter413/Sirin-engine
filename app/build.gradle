plugins { id 'com.android.application' }

android {
    namespace 'com.sirin.engine'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sirin.engine'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    implementation 'com.android.tools.build:apksig:8.5.2'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
}

def prepareRuntimeTemplate = tasks.register("prepareRuntimeTemplate") {
    dependsOn(":runtime:assembleRelease")
    doLast {
        def runtimeOutputs = file("${rootProject.projectDir}/runtime/build/outputs/apk/release")
        def candidates = runtimeOutputs.listFiles()?.findAll {
            it.isFile() && it.name.endsWith(".apk") && !it.name.contains("-androidTest")
        } ?: []
        if (candidates.isEmpty()) {
            throw new GradleException("Runtime APK bulunamadı. Klasör: " + runtimeOutputs.absolutePath)
        }
        def source = candidates.find { it.name.endsWith("-unsigned.apk") } ?: candidates[0]
        if (!source.isFile() || source.length() == 0) {
            throw new GradleException("Runtime APK boş veya geçersiz: " + source)
        }
        def assetsDir = file("${projectDir}/src/main/assets")
        assetsDir.mkdirs()
        copy {
            from source
            into assetsDir
            rename { "runtime-template.apk" }
        }
    }
}

tasks.named("preBuild").configure { dependsOn(prepareRuntimeTemplate) }
