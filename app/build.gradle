plugins { id 'com.android.application' }

android {
    namespace 'com.sirin.engine'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sirin.engine'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release { minifyEnabled false }
    }
}
