plugins { id 'com.android.application' }

android {
    namespace 'com.sirin.runtime'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sirin.runtime'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release { minifyEnabled false }
    }
}
