name: Build Sirin Engine APK

on:
  workflow_dispatch:
    inputs:
      project_zip:
        description: "Sirin project ZIP path"
        required: false
        default: "projects/inbox/current-project.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick zip unzip

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare project and icon
        env:
          PROJECT_ZIP: ${{ inputs.project_zip }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          mkdir -p app/src/main/assets app/src/main/res/drawable

          if [ "$PROJECT_ZIP" = "projects/inbox/current-project.zip" ] && [ ! -f "$PROJECT_ZIP" ]; then
            (cd samples/3d-racing && zip -qr ../../app/src/main/assets/project.zip .)
          else
            cp "$PROJECT_ZIP" app/src/main/assets/project.zip
          fi

          rm -f app/src/main/res/drawable/ic_project_icon.png app/src/main/res/drawable/ic_project_icon.xml

          ICON_PATH=$(unzip -Z1 app/src/main/assets/project.zip | grep -E '(^|/)project\.json$' | head -n 1 || true)
          DECLARED_ICON=""
          if [ -n "$ICON_PATH" ]; then
            TMP_JSON=$(mktemp)
            unzip -p app/src/main/assets/project.zip "$ICON_PATH" > "$TMP_JSON"
            DECLARED_ICON=$(python3 - "$TMP_JSON" <<'PY'
import json,sys
try:
    d=json.load(open(sys.argv[1],encoding='utf-8'))
    print(d.get("icon",""))
except Exception:
    print("")
PY
)
            rm -f "$TMP_JSON"
          fi

          if [ -n "$DECLARED_ICON" ]; then
            ICON_FOUND=$(unzip -Z1 app/src/main/assets/project.zip | grep -Fx "$DECLARED_ICON" | head -n 1 || true)
          else
            ICON_FOUND=""
          fi

          if [ -z "$ICON_FOUND" ]; then
            ICON_FOUND=$(unzip -Z1 app/src/main/assets/project.zip | grep -E '(^|/)icon\.png$' | head -n 1 || true)
          fi

          if [ -n "$ICON_FOUND" ]; then
            unzip -p app/src/main/assets/project.zip "$ICON_FOUND" > app/src/main/res/drawable/ic_project_icon.png
          else
            ICON_SVG=$(unzip -Z1 app/src/main/assets/project.zip | grep -E '(^|/)icon\.svg$' | head -n 1 || true)
            if [ -n "$ICON_SVG" ]; then
              unzip -p app/src/main/assets/project.zip "$ICON_SVG" > /tmp/icon.svg
              convert /tmp/icon.svg -resize 512x512 app/src/main/res/drawable/ic_project_icon.png
            else
              cat > app/src/main/res/drawable/ic_project_icon.xml <<'EOF'
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="108dp"
    android:height="108dp"
    android:viewportWidth="108"
    android:viewportHeight="108">
    <path android:fillColor="#101820" android:pathData="M0,0h108v108h-108z"/>
    <path android:fillColor="#56D6FF" android:pathData="M18,14h72v72h-72z"/>
    <path android:fillColor="#101820" android:pathData="M31,66L36,42L45,28H63L72,42L77,66H31z"/>
  </vector>
EOF
            fi
          fi

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SirinEngine-APK
          path: app/build/outputs/apk/release/app-release.apk
