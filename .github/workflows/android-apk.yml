name: Build Sirin Engine APK

on:
  workflow_dispatch:
    inputs:
      project_zip:
        description: "Sirin project ZIP path in this repository"
        required: true
        default: "projects/inbox/current-project.zip"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare bundled project
        env:
          PROJECT_ZIP: ${{ inputs.project_zip }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          mkdir -p app/src/main/assets app/src/main/res/drawable
          curl -fsSL "https://raw.githubusercontent.com/$REPO/main/$PROJECT_ZIP" -o app/src/main/assets/project.zip
          rm -f app/src/main/res/drawable/ic_project_icon.png app/src/main/res/drawable/ic_project_icon.xml

          PNG_PATH=$(unzip -Z1 app/src/main/assets/project.zip | grep -E '(^|/)icon\.png$' | head -n 1 || true)
          SVG_PATH=$(unzip -Z1 app/src/main/assets/project.zip | grep -E '(^|/)icon\.svg$' | head -n 1 || true)

          if [ -n "$PNG_PATH" ]; then
            unzip -p app/src/main/assets/project.zip "$PNG_PATH" > app/src/main/res/drawable/ic_project_icon.png
          elif [ -n "$SVG_PATH" ]; then
            unzip -p app/src/main/assets/project.zip "$SVG_PATH" > /tmp/icon.svg
            convert /tmp/icon.svg -resize 512x512 app/src/main/res/drawable/ic_project_icon.png
          else
            cat > app/src/main/res/drawable/ic_project_icon.xml <<'EOF'
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
    <path android:fillColor="#101820" android:pathData="M0,0h108v108h-108z"/>
    <path android:fillColor="#56D6FF" android:pathData="M22,18h64v64h-64z"/>
    <path android:fillColor="#101820" android:pathData="M36,34h36v36h-36z"/>
  </vector>
EOF
          fi

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SirinEngine-APK
          path: app/build/outputs/apk/release/app-release.apk
