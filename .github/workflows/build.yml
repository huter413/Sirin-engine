name: Build Sirin Engine APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      project_zip:
        description: "Optional project ZIP path inside the repository"
        required: false
        type: string
        default: "projects/inbox/current-project.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify Android project
        shell: bash
        run: |
          set -euxo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          grep -q 'com.android.application' build.gradle
          grep -q 'android:exported="true"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".MainActivity"' app/src/main/AndroidManifest.xml

      - name: Prepare bundled project
        shell: bash
        env:
          PROJECT_ZIP: ${{ inputs.project_zip }}
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/assets

          if [ -n "${PROJECT_ZIP}" ] && [ -f "${PROJECT_ZIP}" ]; then
            cp "${PROJECT_ZIP}" app/src/main/assets/project.zip
          else
            test -d samples/3d-racing
            command -v zip >/dev/null
            (cd samples/3d-racing && zip -qr "${GITHUB_WORKSPACE}/app/src/main/assets/project.zip" .)
          fi

          unzip -t app/src/main/assets/project.zip

      - name: Prepare engine icon
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_project_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#101820" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#56D6FF" android:pathData="M18,14h72v72h-72z"/>
              <path android:fillColor="#101820" android:pathData="M31,66L36,42L45,28H63L72,42L77,66H31z"/>
          </vector>
          EOF

      - name: Build release APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle --version
          gradle --no-daemon --stacktrace --warning-mode all assembleRelease

      - name: Verify APK output
        shell: bash
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "${APK}"
          test -s "${APK}"
          file "${APK}"
          ls -lh "${APK}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SirinEngine-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
