name: Build Sirin Engine APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify Android project
        shell: bash
        run: |
          set -euxo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          grep -q 'com.android.application' build.gradle
          grep -q 'android:exported="true"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".MainActivity"' app/src/main/AndroidManifest.xml

      - name: Build release APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle --version
          gradle --no-daemon --stacktrace --warning-mode all :app:assembleRelease

      - name: Verify APK output
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find app/build/outputs -type f -name "*.apk" | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          file "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SirinEngine-APK
          path: app/build/outputs/**/*.apk
          if-no-files-found: error
